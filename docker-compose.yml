# Optional convenience wrapper: `docker compose up -d --build`
# Equivalent to: docker run -v finally-data:/app/db -p 8000:8000 --env-file .env finally
services:
  finally:
    build:
      context: .
      dockerfile: Dockerfile
    image: finally
    container_name: finally
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - finally-data:/app/db
    restart: unless-stopped

volumes:
  finally-data:
    name: finally-data
