[project]
name = "finally-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",          # Massive client (async). Listed explicitly even though LiteLLM also pulls it in.
    "tzdata>=2024.1",       # zoneinfo data for America/New_York; Windows has no system tz database
    "litellm>=1.105,<1.106",
    "pydantic>=2.14,<3",
    "python-dotenv>=1.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
