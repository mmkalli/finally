# E2E tests (PLAN.md §12): the app container in mock-LLM mode plus a Playwright
# runner. Run from the repo root:
#   docker compose -f test/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from playwright
#   docker compose -f test/docker-compose.test.yml down -v
# The HTML report lands in test/playwright-report/.
name: finally-e2e

services:
  # Not "app": Chrome forces HTTPS for that hostname (.app is an HSTS-preloaded TLD)
  finally:
    build:
      context: ..
    environment:
      LLM_MOCK: "true"
      # Simulator and mock chat only, even if the host exports real keys
      MASSIVE_API_KEY: ""
      OPENROUTER_API_KEY: ""
    # Faster than the image's 30s interval, so the runner starts as soon as the app is up
    healthcheck:
      interval: 2s
      start_period: 30s
      start_interval: 1s
      retries: 30

  playwright:
    build:
      context: .
    depends_on:
      finally:
        condition: service_healthy
    environment:
      BASE_URL: http://finally:8000
      CI: "true"
    ipc: host
    # The runner is root; hand the report back to the host user (Linux bind mounts keep ownership)
    command:
      - sh
      - -c
      - npx playwright test; s=$$?; chown -R "$${HOST_UID:-1000}:$${HOST_GID:-1000}" playwright-report test-results; exit $$s
    volumes:
      - ./playwright-report:/e2e/playwright-report
      - ./test-results:/e2e/test-results
